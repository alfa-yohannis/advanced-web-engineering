nt component: kotak penyaring)</text><line style="stroke: #333333; stroke-width: 1.0;" x1="451" x2="493" y1="383.762" y2="383.762"/><line style="stroke: #333333; stroke-width: 1.0;" x1="493" x2="493" y1="383.762" y2="396.762"/><line style="stroke: #333333; stroke-width: 1.0;" x1="452" x2="493" y1="396.762" y2="396.762"/><polygon fill="#333333" points="462,392.762,452,396.762,462,400.762,458,396.762" style="stroke: #333333; stroke-width: 1.0;"/><text fill="#000000" font-family="Sans" font-size="20" lengthAdjust="spacingAndGlyphs" textLength="339" x="458" y="348.662">pengguna mengetik, 6 baris disaring</text><text fill="#000000" font-family="Sans" font-size="20" lengthAdjust="spacingAndGlyphs" textLength="323" x="458" y="375.902">di browser, tanpa permintaan baru</text><!--MD5=[ef3974d13143a80f5d87d6b5ae8f1a98]
@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam defaultFontName Sans
skinparam defaultFontSize 22
skinparam sequence {
  ArrowColor #333333
  ArrowFontSize 20
  LifeLineBorderColor #999999
  ParticipantBorderColor #333333
  ParticipantFontStyle bold
  ParticipantPadding 30
}
skinparam note {
  BorderColor #6B86A3
  FontSize 19
}

participant "Browser" as B #FFF4E0
participant "Server" as S #DEE9E3

B -> S : GET /islands
S - -> B : HTML 625 byte, 6 judul sudah tergambar\n(server component yang menyusunnya)
note left of B #EBEBFF: isi tampil, belum ada satu baris JavaScript pun
B -> S : GET /aset/pulau.js
S - -> B : 697 byte, satu pulau dihidupkan\n(client component: kotak penyaring)
B -> B : pengguna mengetik, 6 baris disaring\ndi browser, tanpa permintaan baru
@enduml

