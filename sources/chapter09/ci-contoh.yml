# Contoh pipeline CI/CD untuk layanan Bab 9.
# File ini bahan bacaan, bukan pipeline yang aktif. Untuk mengaktifkannya,
# salin ke .github/workflows/ di repositori Anda sendiri.
#
# Urutannya sengaja sama dengan urutan gate pada bab sebelumnya: yang paling
# murah dan paling sering gagal dijalankan lebih dahulu.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisis statis
        run: ruff check sources/chapter09

      - name: Uji unit dan integrasi
        run: pytest -q sources/chapter06

      - name: Bangun image
        run: docker build -t awe9-layanan sources/chapter09

      - name: Nyalakan layanan lalu periksa SLO
        run: |
          VERSI=biru PORT=8061 python3 sources/chapter09/aplikasi.py &
          VERSI=hijau PORT=8062 python3 sources/chapter09/aplikasi.py &
          sleep 2
          python3 sources/chapter09/proxy.py &
          sleep 1
          python3 sources/chapter09/ukur-rilis.py 100
          python3 sources/chapter09/alarm.py
