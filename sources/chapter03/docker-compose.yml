# Basis data untuk seluruh latihan Bab 3.
# Jalankan dengan: docker compose up -d
# Hentikan dengan: docker compose down -v  (-v ikut menghapus datanya)

services:
  db:
    image: postgres:16
    container_name: awe-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: toko
    ports:
      - "5433:5432"
    # Angka di bawah sengaja kecil agar batas koneksi terlihat pada peragaan
    # pool-koneksi.py.
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
    volumes:
      - data-awe:/var/lib/postgresql/data

volumes:
  data-awe:
