# Basis data untuk seluruh latihan Bab 7.
# Jalankan dengan: docker compose up -d
# Hentikan dengan: docker compose down -v  (-v ikut menghapus datanya)
#
# Port sengaja berbeda dari bab lain, agar container tiap bab dapat menyala
# bersamaan tanpa berebut port.

services:
  db:
    image: postgres:16
    container_name: awe7-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: toko
    ports:
      - "5437:5432"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      - data-awe7:/var/lib/postgresql/data

volumes:
  data-awe7:
