# Basis data untuk seluruh latihan Bab 5.
# Jalankan dengan: docker compose up -d
# Hentikan dengan: docker compose down -v  (-v ikut menghapus datanya)
#
# Port sengaja berbeda dari Bab 3 (5433) dan Bab 4 (5434), agar container
# ketiga bab dapat menyala bersamaan tanpa berebut port.

services:
  db:
    image: postgres:16
    container_name: awe5-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: toko
    ports:
      - "5435:5432"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      - data-awe5:/var/lib/postgresql/data

volumes:
  data-awe5:
